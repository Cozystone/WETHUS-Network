<html lang="ko">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WETHUS | 팀원 프로필</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css?v=20260419-25" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="wordmark">WETHUS</a>
      <nav class="nav-links">
        <a href="explore.html" class="nav-link">탐색</a>
        <a href="founder.html" class="nav-link">프로젝트 시작하기</a>
        <a href="project-hub.html" class="nav-link">프로젝트 허브</a>
        <a href="mentor.html" class="nav-link">멘토</a>
        <a href="profile.html" class="nav-link">프로필</a>
        <a href="login.html" class="nav-link js-auth-link">로그인</a>
      </nav>
    </div>
  </header>

  <main class="container page-main page-main--standard">
    <section class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
      <div>
        <h1 class="page-title">팀원 프로필</h1>
        <p class="page-sub">팀원 포트폴리오를 확인합니다.</p>
      </div>
      <button id="memberClose" class="modal-close" aria-label="뒤로가기" style="position:static;">×</button>
    </section>

    <section class="profile-hero" id="memberHero"></section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <span class="wordmark">WETHUS</span>
        <p class="footer-copy">학생 창업 실행 플랫폼 WETHUS<br/><a href="mailto:wethus.biz@gmail.com">wethus.biz@gmail.com</a></p>
      </div>
    </div>
  </footer>


  <script src="app.js?v=20260814-service-integration-5"></script>
  <script>
    const authLink = document.querySelector('.js-auth-link');
    const state = WETHUS.getState();
    if (state.currentUserId || state.devMode) {
      authLink.textContent = '로그아웃';
      authLink.href = '#';
      authLink.addEventListener('click', (e) => { e.preventDefault(); WETHUS.logout(); location.href='login.html'; });
    }

    const closeBtn = document.getElementById('memberClose');
    closeBtn?.addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.href = 'explore.html';
    });
    const memberPageSub = document.querySelector('.page-sub');
    if (memberPageSub) memberPageSub.textContent = '실행 흔적과 프로젝트 참여 기록';

    const params = new URLSearchParams(location.search);
    const member = {
      name: params.get('name') || '팀원',
      role: params.get('role') || '담당 미정',
      bio: params.get('bio') || '소개가 아직 없습니다.',
      founder: params.get('founder') === '1',
      mentor: params.get('mentor') === '1'
    };
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
    const safeUrl = (value) => {
      const raw = String(value || '').trim();
      if (!raw) return '';
      if (/^https?:/i.test(raw)) return raw;
      if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(raw)) return `https://${raw}`;
      return '';
    };
    const formatShortDate = (value) => {
      if (!value) return '오늘';
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return '오늘';
      return `${parsed.getFullYear()}.${String(parsed.getMonth() + 1).padStart(2, '0')}.${String(parsed.getDate()).padStart(2, '0')}`;
    };
    function buildMemberPortfolioSubnav() {
      const heroRoot = document.getElementById('memberHero');
      const profileMainRoot = heroRoot?.querySelector('.profile-main--portfolio');
      const topLineRoot = profileMainRoot?.querySelector('.profile-topline--portfolio');
      if (!heroRoot || !profileMainRoot || !topLineRoot) return;

      const storyGridRoot = heroRoot.querySelector('.profile-story-grid');
      const directCards = Array.from(profileMainRoot.children).filter((node) => node.classList?.contains('profile-portfolio-card'));
      const snapshotCard = directCards[0] || topLineRoot;
      const sectionTitles = Array.from(document.querySelectorAll('.projects-head-row .section-title'));
      const signalSection = sectionTitles.find((node) => node.textContent?.includes('실행 신호'))?.closest('.projects-head-row')?.nextElementSibling || null;
      const featuredSection = sectionTitles.find((node) => node.textContent?.includes('대표 프로젝트'))?.closest('.projects-head-row')?.nextElementSibling || null;
      const archiveSection = document.querySelector('.member-project-grid');
      const navSections = [
        { key: 'overview', label: '소개', node: snapshotCard },
        { key: 'proof', label: '창업 기록부', node: storyGridRoot?.querySelector('.profile-portfolio-card') || signalSection },
        { key: 'links', label: '검증 링크', node: storyGridRoot?.querySelectorAll('.profile-portfolio-card')?.[1] || storyGridRoot },
        { key: 'featured', label: '대표 프로젝트', node: featuredSection || signalSection },
        { key: 'archive', label: '기록 보관함', node: archiveSection }
      ].filter((section) => section.node);

      navSections.forEach((section) => {
        section.node.id = section.node.id || `member-${section.key}-section`;
        section.node.classList.add('profile-portfolio-anchor');
      });

      let subnav = heroRoot.querySelector('[data-portfolio-subnav="member"]');
      if (!subnav) {
        subnav = document.createElement('div');
        subnav.className = 'profile-subnav';
        subnav.setAttribute('data-portfolio-subnav', 'member');
        topLineRoot.insertAdjacentElement('afterend', subnav);
      }

      subnav.innerHTML = navSections.map((section, index) => `
        <button class="profile-subnav-btn ${index === 0 ? 'active' : ''}" type="button" data-target="${esc(section.node.id)}">${esc(section.label)}</button>
      `).join('');

      if (!subnav.dataset.bound) {
        subnav.addEventListener('click', (event) => {
          const btn = event.target.closest('[data-target]');
          if (!btn) return;
          const target = document.getElementById(btn.getAttribute('data-target'));
          if (!target) return;
          subnav.querySelectorAll('.profile-subnav-btn').forEach((node) => node.classList.remove('active'));
          btn.classList.add('active');
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        subnav.dataset.bound = 'true';
      }
    }
    const requestedUserId = String(params.get('userId') || '').trim();
    const stateUsers = Array.isArray(WETHUS.getState()?.users) ? WETHUS.getState().users : [];
    const networkUsers = WETHUS.listNetworkPeople ? WETHUS.listNetworkPeople() : [];
    const directoryUsers = [...stateUsers, ...networkUsers].reduce((map, candidate) => {
      if (candidate?.id) map.set(String(candidate.id), { ...(map.get(String(candidate.id)) || {}), ...candidate });
      return map;
    }, new Map());
    const matchedUser = Array.from(directoryUsers.values()).find((candidate) => {
      if (!candidate) return false;
      if (requestedUserId && String(candidate.id || '') === requestedUserId) return true;
      return [candidate.name, candidate.nickname].some((value) => String(value || '').trim() === String(member.name || '').trim());
    }) || null;
    const resolvedMember = matchedUser ? {
      ...member,
      name: matchedUser.name || member.name,
      nickname: matchedUser.nickname || member.name,
      bio: matchedUser.bio || member.bio,
      founder: !!matchedUser.founderVerified || member.founder,
      headline: matchedUser.headline || member.role || '',
      startupBelief: matchedUser.startupBelief || '',
      lookingFor: matchedUser.lookingFor || '',
      school: matchedUser.school || '',
      age: matchedUser.age ?? null,
      interestTags: matchedUser.interestTags || [],
      portfolioHighlights: matchedUser.portfolioHighlights || matchedUser.careerSummary || '',
      instagramUrl: matchedUser.instagramUrl || '',
      githubUrl: matchedUser.githubUrl || '',
      linkedinUrl: matchedUser.linkedinUrl || '',
      portfolioUrl: matchedUser.portfolioUrl || '',
      profileImage: matchedUser.profileImage || '',
      userId: matchedUser.id || ''
    } : { ...member, nickname: member.name.replace(/\s+/g,'').toLowerCase(), startupBelief: '' };
    member.name = resolvedMember.name || member.name;
    member.role = resolvedMember.headline || member.role;
    member.bio = resolvedMember.bio || member.bio;
    member.founder = resolvedMember.founder || member.founder;
    if (resolvedMember.userId && WETHUS.recordProfileView) {
      WETHUS.recordProfileView(resolvedMember.userId);
    }

    const me = WETHUS.currentUser();
    const plan = String(me?.plan || 'free').toLowerCase();
    const paid = ['premium', 'pro', 'master'].includes(plan);
    const myTeamNames = new Set((WETHUS.myProjects() || []).flatMap(p => (p.teamMembers || []).map(m => m.name)));
    const canViewDetail = true;

    const mentorBadge = resolvedMember.mentor ? '<span class="verify-badge" style="background:#6d28d9;color:#f5f3ff;border-color:#8b5cf6;">Mentor 인증</span>' : '';
    document.getElementById('memberHero').innerHTML = `
      <div class="profile-avatar">${esc(member.name.slice(0,1))}</div>
      <div class="profile-main">
        <div class="profile-topline" style="justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            <h2>${esc(member.name)}</h2>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <span class="profile-nickname">@${esc(resolvedMember.nickname || member.name.replace(/\s+/g,'').toLowerCase())}</span>
              ${resolvedMember.founder ? '<span class="verify-badge">Founder 인증</span>' : ''}
              ${mentorBadge}
            </div>
          </div>
          <button id="memberDmBtn" class="btn btn--primary" type="button">DM 보내기</button>
        </div>
        <p class="profile-bio">${canViewDetail ? esc(member.bio) : '상세 프로필은 Premium/Pro 플랜에서 열립니다. (내 팀원 제외)'}</p>
        ${canViewDetail ? '' : '<p class="meta" style="margin-top:6px;">업그레이드 시 경력과 상세 정보가 열립니다.</p>'}
      </div>
    `;

    const renderMemberPortfolio = () => {
      const detailMember = resolvedMember;
      const displayName = detailMember.name || member.name;
      const detailAllowed = true;
      const currentProjects = WETHUS.listProjects().filter((project) => {
        if (!project) return false;
        if (String(project.founderId || '') === String(detailMember.userId || '')) return true;
        if (String(project.founderName || '').trim() === String(detailMember.name || member.name).trim()) return true;
        return Array.isArray(project.teamMembers) && project.teamMembers.some((teamMember) => {
          const targetName = String(detailMember.name || member.name).trim();
          const targetId = String(detailMember.userId || '').trim();
          return String(teamMember?.id || '').trim() === targetId || String(teamMember?.userId || '').trim() === targetId || String(teamMember?.name || '').trim() === targetName;
        });
      });
      const socialLinks = [
        { label: 'Instagram', href: detailMember.instagramUrl },
        { label: 'GitHub', href: detailMember.githubUrl },
        { label: 'LinkedIn', href: detailMember.linkedinUrl },
        { label: 'Portfolio', href: detailMember.portfolioUrl }
      ].filter((item) => detailAllowed && safeUrl(item.href));
      const socialLinkPriority = { Portfolio: 0, GitHub: 1, LinkedIn: 2, Instagram: 3 };
      const sortedSocialLinks = [...socialLinks].sort((a, b) => (socialLinkPriority[a.label] ?? 9) - (socialLinkPriority[b.label] ?? 9));
      const primarySocialLink = sortedSocialLinks[0] || null;
      const highlightLines = String(detailMember.portfolioHighlights || '').split('\n').map((line) => line.replace(/^[•\-]\s*/, '').trim()).filter(Boolean).slice(0, 4);
      const avatarMarkup = detailMember.profileImage
        ? `<img src="${esc(safeUrl(detailMember.profileImage))}" alt="프로필" class="profile-mini-avatar" style="width:64px;height:64px;"/>`
        : `<div class="profile-avatar" style="width:64px;height:64px;font-size:1.45rem;">${esc(displayName.slice(0,1))}</div>`;
      const hasMeaningfulBio = !!String(detailMember.bio || '').trim() && !/없습니다|미정|비어/.test(String(detailMember.bio || ''));
      const interestMarkup = detailAllowed && Array.isArray(detailMember.interestTags) && detailMember.interestTags.length
        ? `<div class="hero-tags profile-tag-row">${detailMember.interestTags.map((tag) => `<span class="chip">${esc(tag)}</span>`).join('')}</div>`
        : '';
      const socialLinkCardsMarkup = sortedSocialLinks.length
        ? `<div class="profile-link-stack">${sortedSocialLinks.map((item) => {
            let host = '';
            try {
              host = new URL(safeUrl(item.href)).hostname.replace(/^www\\./, '');
            } catch (_) {}
            return `<a class="profile-link-card" href="${esc(safeUrl(item.href))}" target="_blank" rel="noreferrer"><span class="profile-link-label">${esc(item.label)}</span><strong>${esc(host || item.label)}</strong><span>외부 활동 보기</span></a>`;
          }).join('')}</div>`
        : '';
      const memberVerificationMarkup = sortedSocialLinks.length
        ? `
          <section class="profile-portfolio-card">
            <p class="profile-story-kicker">Verify</p>
            <h3>외부 검증 루트</h3>
            <p class="profile-section-note">실제 작업물, 코드, 브랜드 흔적을 바로 열어볼 수 있는 공개 링크입니다.</p>
            ${socialLinkCardsMarkup}
          </section>
        `
        : '';
      const memberReviewCardsMarkup = `
        <div class="profile-cred-grid">
          <div class="profile-cred-card">
            <strong>집중 분야</strong>
            <p>${esc(Array.isArray(detailMember.interestTags) && detailMember.interestTags.length ? detailMember.interestTags.slice(0, 3).join(' · ') : (detailMember.role || '관심 분야를 아직 공개하지 않았습니다.'))}</p>
          </div>
          <div class="profile-cred-card">
            <strong>대표 근거</strong>
            <p>${esc(highlightLines[0] || detailMember.headline || detailMember.bio || '실행 이력이 아직 등록되지 않았습니다.')}</p>
          </div>
          <div class="profile-cred-card">
            <strong>외부 연결</strong>
            <p>${esc(socialLinks.length ? `${socialLinks.map((item) => item.label).join(' · ')} 연결됨` : '외부 링크가 아직 없습니다.')}</p>
          </div>
        </div>
      `;
      const memberSnapshotCards = [
        {
          label: '역할',
          value: detailMember.headline || detailMember.role || (Array.isArray(detailMember.interestTags) && detailMember.interestTags.length ? detailMember.interestTags.slice(0, 2).join(' · ') : '프로젝트 참여자')
        },
        {
          label: '근거',
          value: highlightLines[0] || detailMember.bio || '포트폴리오 하이라이트가 아직 없습니다.'
        },
        {
          label: '흔적',
          value: socialLinks.length ? `${socialLinks.length}개 외부 링크 연결` : '외부 링크 비공개 또는 미연결'
        },
        {
          label: '지금',
          value: detailMember.lookingFor || '현재 원하는 협업 조건이 아직 공개되지 않았습니다.'
        }
      ];
      const memberSnapshotMarkup = `
        <div class="profile-snapshot-grid">
          ${memberSnapshotCards.map((card) => `
            <div class="profile-snapshot-card">
              <strong>${esc(card.label)}</strong>
              <span>${esc(card.value)}</span>
            </div>
          `).join('')}
        </div>
      `;
      const memberViewStats = detailMember.userId && WETHUS.getProfileViewStats
        ? WETHUS.getProfileViewStats(detailMember.userId)
        : { today: 0, total: 0 };
      const memberFollowStats = detailMember.userId && WETHUS.getProfileFollowStats
        ? WETHUS.getProfileFollowStats(detailMember.userId)
        : { followers: 0 };
      const memberFollowerCount = Number(memberFollowStats.followers || 0);
      const memberFollowing = detailMember.userId && WETHUS.isFollowingProfile
        ? WETHUS.isFollowingProfile(detailMember.userId)
        : false;
      const heroSummaryMeta = [
        detailMember.school,
        detailMember.age ? `Age ${detailMember.age}` : '',
        detailMember.role && !/미정|없습니다|없음/i.test(String(detailMember.role || '')) ? detailMember.role : ''
      ].filter(Boolean);
      const heroSummaryStats = [
        currentProjects.length ? `Projects ${currentProjects.length}` : '',
        sortedSocialLinks.length ? `Links ${sortedSocialLinks.length}` : '',
        memberFollowerCount ? `Followers ${memberFollowerCount}` : ''
      ].filter(Boolean);
      const topRouteCards = [
        detailMember.headline || detailMember.role
          ? { title: 'Overview', body: detailMember.headline || detailMember.role }
          : null,
        currentProjects[0]?.title || highlightLines[0]
          ? { title: 'Work', body: currentProjects[0]?.title || highlightLines[0] }
          : null,
        primarySocialLink
          ? { title: 'Verify', body: `${primarySocialLink.label} open` }
          : null
      ].filter(Boolean);
      const memberPresenceMarkup = `
        <section class="profile-portfolio-card">
          <p class="profile-story-kicker">공개 신호</p>
          <h3>공개 포트폴리오 신호</h3>
          <div class="profile-presence-grid">
            <article class="profile-presence-card">
              <span class="profile-presence-label">오늘 방문</span>
              <strong class="profile-presence-value">${esc(String(memberViewStats.today || 0))}</strong>
              <p class="profile-presence-copy">오늘 이 프로필을 본 고유 방문 수입니다.</p>
            </article>
            <article class="profile-presence-card">
              <span class="profile-presence-label">누적 방문</span>
              <strong class="profile-presence-value">${esc(String(memberViewStats.total || 0))}</strong>
              <p class="profile-presence-copy">공개 프로필의 읽힘 정도입니다.</p>
            </article>
            <article class="profile-presence-card">
              <span class="profile-presence-label">팔로워</span>
              <strong class="profile-presence-value">${esc(String(memberFollowerCount))}</strong>
              <p class="profile-presence-copy">이 창업자의 공개 기록을 계속 보려는 사람 수입니다.</p>
            </article>
            <article class="profile-presence-card">
              <span class="profile-presence-label">외부 검증</span>
              <strong class="profile-presence-value">${esc(String(socialLinks.length || 0))}</strong>
              <p class="profile-presence-copy">${esc(socialLinks.length ? socialLinks.map((item) => item.label).join(' · ') : '외부 링크가 아직 없습니다.')}</p>
            </article>
            <article class="profile-presence-card">
              <span class="profile-presence-label">실행 근거</span>
              <strong class="profile-presence-value">${esc(String(highlightLines.length || 0))}</strong>
              <p class="profile-presence-copy">${esc(highlightLines[0] || detailMember.headline || '대표 근거가 아직 공개되지 않았습니다.')}</p>
            </article>
          </div>
        </section>
      `;
      const showcaseProjects = currentProjects.slice(0, 3);
      const memberShowcaseMarkup = showcaseProjects.length
        ? `
          <div class="profile-showcase-grid">
            ${showcaseProjects.map((project, index) => {
              const roleLabel = String(project?.founderId || '') === String(detailMember.userId || '') ? 'Leader project' : 'Team contribution';
              const statPills = [
                project?.status || '',
                project?.category || '',
                project?.teamSize || '',
                Number(project?.likes || 0) ? `좋아요 ${Number(project.likes || 0)}` : '',
                Array.isArray(project?.comments) && project.comments.length ? `댓글 ${project.comments.length}` : ''
              ].filter(Boolean).slice(0, 4);
              return `
                <article class="profile-showcase-card${index === 0 ? ' profile-showcase-card--lead' : ''}">
                  <div class="profile-showcase-media"${project?.image ? ` style="background-image:url('${esc(safeUrl(project.image))}');"` : ''}>
                    <span class="profile-showcase-badge">${esc(roleLabel)}</span>
                  </div>
                  <div class="profile-showcase-body">
                    <div class="profile-showcase-head">
                      <strong>${esc(project?.title || '프로젝트')}</strong>
                      <span>${esc(project?.category || 'Portfolio')}</span>
                    </div>
                    <p>${esc(project?.summary || '이 멤버가 참여한 공개 작업을 바로 확인할 수 있습니다.')}</p>
                    <div class="profile-showcase-pills">
                      ${statPills.map((item) => `<span>${esc(item)}</span>`).join('')}
                    </div>
                    <div class="profile-showcase-actions">
                      <a class="profile-link-pill" href="project-hub.html?projectId=${encodeURIComponent(project?.id || '')}">프로젝트 허브</a>
                    </div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        `
        : '<p class="profile-section-note">아직 공개된 프로젝트 포트폴리오가 없습니다.</p>';
      let primarySocialHost = '';
      try {
        primarySocialHost = primarySocialLink ? new URL(safeUrl(primarySocialLink.href)).hostname.replace(/^www\./, '') : '';
      } catch (_) {}
      const verificationRouteMarkup = `
        <section class="profile-portfolio-card profile-proof-route-shell">
          <div class="profile-proof-route-head">
            <div>
              <p class="profile-story-kicker">검증 루트</p>
              <h3>이 멤버를 검증하는 빠른 루트</h3>
            </div>
            <span class="profile-proof-pill">${esc(sortedSocialLinks.length ? `${sortedSocialLinks.length}개 링크 연결` : '외부 링크 준비 중')}</span>
          </div>
          <div class="profile-proof-route-grid">
            <article class="profile-proof-route-card">
              <span class="profile-proof-route-label">대표 링크</span>
              <strong>${esc(primarySocialLink?.label || 'Portfolio / GitHub 추천')}</strong>
              <p>${esc(primarySocialLink ? `${primarySocialHost || primarySocialLink.label}에서 작업 흔적을 엽니다.` : '대표 링크를 연결하면 이 카드가 채워집니다.')}</p>

        return /(아직|없습니다|없음|비공개|대기|미연결|정리 중|준비 중|등록되지|공개되지)/.test(text);
      };
      const explicitPlaceholderRegex = /(?:\ub2f4\ub2f9\s*\ubbf8\uc815|\uc544\uc9c1|\uc5c6\uc2b5\ub2c8\ub2e4|\uc5c6\uc74c|\uc678\ubd80\s+\ub9c1\ud06c\uac00\s+\uc544\uc9c1\s+\uc5c6\uc2b5\ub2c8\ub2e4|\uacf5\uac1c\ub41c\s+\ubaa8\uc9d1\/\ud611\uc5c5\s+\uc694\uccad\uc774\s+\uc544\uc9c1\s+\uc5c6\uc2b5\ub2c8\ub2e4)/;
      const bio = root.querySelector('.profile-bio');
      if (bio && (isPlaceholderText(bio.textContent) || /(미정|없습니다|없음)/.test(String(bio.textContent || '')))) bio.remove();
      const routeStrip = root.querySelector('.profile-route-strip');
      if (routeStrip) {
        Array.from(routeStrip.querySelectorAll('.profile-route-card')).forEach((card) => {
          const bodyText = String(card.querySelector('span')?.textContent || card.textContent || '').trim();
          if (isPlaceholderText(bodyText) || /(미정|없습니다|없음)/.test(bodyText)) card.remove();
        });
        if (!routeStrip.querySelector('.profile-route-card')) routeStrip.remove();
      }
      const proofCard = root.querySelector('.profile-proof-card');
      if (proofCard) {
        const metaText = String(proofCard.querySelector('.meta')?.textContent || '').trim();
        const chips = Array.from(proofCard.querySelectorAll('.profile-proof-inline span')).map((node) => String(node.textContent || '').trim());
        const allZero = chips.length && chips.every((text) => /0$/.test(text));
        if (isPlaceholderText(metaText) && allZero) proofCard.remove();
      }
      if (routeStrip) {
        Array.from(routeStrip.querySelectorAll('.profile-route-card')).forEach((card) => {
          const bodyText = String(card.querySelector('span')?.textContent || card.textContent || '').trim();
          if (explicitPlaceholderRegex.test(bodyText)) card.remove();
        });
        if (!routeStrip.querySelector('.profile-route-card')) routeStrip.remove();
      }
      if (proofCard) {
        const metaText = String(proofCard.querySelector('.meta')?.textContent || '').trim();
        const chips = Array.from(proofCard.querySelectorAll('.profile-proof-inline span')).map((node) => String(node.textContent || '').trim());
        const allZero = chips.length && chips.every((text) => /0$/.test(text));
        if (explicitPlaceholderRegex.test(metaText) && allZero) proofCard.remove();
      }
      const intro = root.querySelector('.profile-portfolio-intro');
      if (intro) {
        Array.from(intro.querySelectorAll('.profile-portfolio-intro-card')).forEach((card) => {
          if (card.classList.contains('profile-portfolio-intro-card--lead')) return;
          const linkCount = card.querySelectorAll('.profile-portfolio-intro-link').length;
          const meaningfulBullets = Array.from(card.querySelectorAll('.profile-portfolio-intro-list li')).some((item) => !isPlaceholderText(item.textContent));
          const meaningfulStrong = Array.from(card.querySelectorAll('strong')).some((item) => !isPlaceholderText(item.textContent));
          if (!linkCount && !meaningfulBullets && !meaningfulStrong) card.remove();
        });
      }
      const dossierGrid = root.querySelector('.profile-dossier-grid');
      if (dossierGrid) {
        const routeCard = dossierGrid.querySelectorAll('.profile-dossier-card')[1] || null;
        if (routeCard) {
          const routeBullets = Array.from(routeCard.querySelectorAll('li')).some((item) => !isPlaceholderText(item.textContent));
          const routeLinks = routeCard.querySelectorAll('.profile-link-pill').length;
          if (!routeBullets && routeLinks <= 1) routeCard.remove();
        }
      }
      const presenceCard = Array.from(root.querySelectorAll('.profile-portfolio-card')).find((card) => card.querySelector('.profile-presence-grid'));
      if (presenceCard) {
        const values = Array.from(presenceCard.querySelectorAll('.profile-presence-value')).map((node) => String(node.textContent || '').trim());
        if (values.length && values.every((value) => value === '0')) presenceCard.remove();
      }
      const evaluatorRail = root.querySelector('.profile-evaluator-rail');
      if (evaluatorRail) {
        const evaluatorCards = Array.from(evaluatorRail.querySelectorAll('.profile-evaluator-card'));
        const hasMeaningfulEvaluator = evaluatorCards.some((card) => {
          const text = [
            card.querySelector('.profile-evaluator-card strong, strong')?.textContent || '',
            card.querySelector('p')?.textContent || '',
            card.querySelector('.profile-evaluator-meta')?.textContent || ''
          ].join(' ');
          return !isPlaceholderText(text) && !/link missing|proof needed|add collaboration ask|projects 0/i.test(text);
        });
        if (!hasMeaningfulEvaluator) evaluatorRail.remove();
      }
      const proofboard = root.querySelector('.profile-portfolio-proofboard');
      if (proofboard) {
        const hasProofboardLink = !!proofboard.querySelector('.profile-link-pill[href^="http"]');
        const proofboardPills = Array.from(proofboard.querySelectorAll('.profile-proof-pill')).map((node) => String(node.textContent || '').trim());
        const allZeroCounts = proofboardPills.length && proofboardPills.every((text) => /0/.test(text));
        const proofboardTexts = Array.from(proofboard.querySelectorAll('strong, p, li')).map((node) => String(node.textContent || '').trim()).filter(Boolean);
        const allProofboardPlaceholder = proofboardTexts.length && proofboardTexts.every((text) => isPlaceholderText(text) || /^\d+$/.test(text));
        if (!hasProofboardLink && (allZeroCounts || allProofboardPlaceholder)) proofboard.remove();
      }
      const routeShell = root.querySelector('.profile-proof-route-shell');
      if (routeShell) {
        Array.from(routeShell.querySelectorAll('.profile-proof-route-card')).forEach((card) => {
          const hasRealLink = !!card.querySelector('.profile-proof-route-link');
          const emptyState = card.querySelector('.profile-proof-route-empty');
          const title = card.querySelector('strong')?.textContent || '';
          if (!hasRealLink && emptyState && isPlaceholderText(title) && !/\d/.test(emptyState.textContent || '')) card.remove();
        });
        if (!routeShell.querySelector('.profile-proof-route-card')) {
          routeShell.closest('.profile-portfolio-card')?.remove();
        }
      }
      Array.from(root.querySelectorAll('.profile-portfolio-card')).forEach((card) => {
        const heading = [
          card.querySelector('.profile-story-kicker')?.textContent || '',
          card.querySelector('h3')?.textContent || '',
          card.querySelector('strong')?.textContent || ''
        ].join(' ').toLowerCase();
        const texts = Array.from(card.querySelectorAll('p, li, span, strong')).map((node) => String(node.textContent || '').trim()).filter(Boolean);
        const hasRealRouteLink = !!card.querySelector('.profile-proof-route-link, .profile-link-card, .profile-link-pill[href^="http"]');
        const allPlaceholder = texts.length && texts.every((text) => isPlaceholderText(text) || /^\d+$/.test(text));
        if (/공개 신호|공개 포트폴리오 신호|검증 루트|프로필 요약|한눈에 보는 실행 이력|지금 찾는 협업/.test(heading) && !hasRealRouteLink && allPlaceholder) {
          card.remove();
        }
      });
    })();
    setTimeout(() => {
      const hero = document.getElementById('memberHero');
      if (!hero) return;
      const explicitPlaceholderRegex = /(?:\ub2f4\ub2f9\s*\ubbf8\uc815|\uc18c\uac1c\uac00\s+\uc544\uc9c1\s+\uc5c6\uc2b5\ub2c8\ub2e4|\uc678\ubd80\s+\ub9c1\ud06c\uac00\s+\uc544\uc9c1\s+\uc5c6\uc2b5\ub2c8\ub2e4)/;
      hero.querySelectorAll('.profile-route-card').forEach((card) => {
        const body = String(card.querySelector('span')?.textContent || '').trim();
        if (explicitPlaceholderRegex.test(body)) card.remove();
      });
      const routeStrip = hero.querySelector('.profile-route-strip');
      if (routeStrip && !routeStrip.querySelector('.profile-route-card')) routeStrip.remove();
      const bio = hero.querySelector('.profile-bio');
      if (bio && explicitPlaceholderRegex.test(String(bio.textContent || ''))) bio.remove();
      const proofMeta = hero.querySelector('.profile-proof-card .meta');
      const proofInline = Array.from(hero.querySelectorAll('.profile-proof-card .profile-proof-inline span')).map((node) => String(node.textContent || '').trim());
      if (proofMeta && explicitPlaceholderRegex.test(String(proofMeta.textContent || '')) && proofInline.length && proofInline.every((text) => /0$/.test(text))) {
        hero.querySelector('.profile-proof-card')?.remove();
      }
    }, 0);
    const executionSignals = [
      projects.length ? `직접 참여한 프로젝트 ${projects.length}건으로 현재 움직임이 확인됩니다.` : '',
      founderProjects.length ? `이 중 ${founderProjects.length}건은 직접 리드한 Founder 프로젝트입니다.` : '',
      (likesReceived || commentsReceived) ? `공개 반응은 좋아요 ${likesReceived}개, 댓글 ${commentsReceived}개입니다.` : '',
      featuredProject?.title ? `대표 프로젝트는 "${featuredProject.title}"입니다.` : ''
    ].filter(Boolean).slice(0, 4);
    const wrap = document.createElement('section');
    wrap.innerHTML = `
      <section class="projects-head-row" style="margin-top:16px;">
        <h2 class="section-title" style="font-size:1.3rem;margin:0;">참여 프로젝트</h2>
      </section>
      <section class="list-grid">${projects.length ? projects.map(p => `<article class=\"list-item\"><span class=\"card-chip\">${esc(p.category||'')}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary||'')}</p><div class=\"meta\">${esc(p.status||'')} · ${esc(p.teamSize||'')}</div></article>`).join('') : '<article class="list-item"><p class="page-sub">참여 프로젝트가 없습니다.</p></article>'}</section>
    `;
    document.querySelector('main.container')?.appendChild(wrap);
    wrap.querySelector('.section-title')?.replaceChildren(document.createTextNode('프로젝트 아카이브'));
    const memberProjectList = wrap.querySelector('.list-grid');
    wrap.querySelector('.projects-head-row')?.remove();
    memberProjectList?.insertAdjacentHTML('beforebegin', `
      <section class="projects-head-row" style="margin-top:16px;">
        <h2 class="section-title" style="font-size:1.3rem;margin:0;">프로젝트 아카이브</h2>
      </section>
      <p class="profile-section-note" style="margin:0 0 12px;">이 멤버가 참여했거나 운영 중인 프로젝트를 모아둔 영역입니다.</p>
    `);
    if (memberProjectList) {
      memberProjectList.outerHTML = projects.length ? `
        <section class="member-project-grid">
          ${projects.map((p) => `
            <article class="member-project-card">
              <img src="${esc(safeUrl(p.image || `https://picsum.photos/seed/member-${encodeURIComponent(p.id || p.title || 'project')}/900/560`))}" alt="${esc(p.title || 'project')}" />
              <div class="member-project-body">
                <div class="chip-row">
                  <span class="card-chip">${esc(p.category || 'Project')}</span>
                  <span class="card-chip">${esc(p.status || '')}</span>
                </div>
                <h3>${esc(p.title || '')}</h3>
                <p class="profile-project-summary">${esc(p.summary || '')}</p>
                <p class="profile-project-meta">${esc([p.teamSize, p.roles].filter(Boolean).join(' · '))}</p>
                <div class="member-project-actions">
                  <a class="btn btn--secondary" href="explore_theme.html?cat=${encodeURIComponent((() => {
                    const c = String(p.category || '').toLowerCase();
                    if (/(startup|business|app)/.test(c)) return 'StartupBusiness';
                    if (/(art|film|creative|culture)/.test(c)) return 'ArtCulture';
                    if (/(policy|society|law|campaign)/.test(c)) return 'SocietyLaw';
                    if (/(math|science|research)/.test(c)) return 'MathSci';
                    return 'StartupBusiness';
                  })())}">탐색에서 보기</a>
                  <a class="btn btn--primary" href="project-hub.html?projectId=${encodeURIComponent(p.id || '')}">프로젝트 열기</a>
                </div>
              </div>
            </article>
          `).join('')}
        </section>
      ` : '<section class="member-project-grid"><article class="profile-portfolio-card"><p class="page-sub">참여 프로젝트가 아직 없습니다.</p></article></section>';
    }
    buildMemberPortfolioSubnav();
  </script>
</body>
</html>
