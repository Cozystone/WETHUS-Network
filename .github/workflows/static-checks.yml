name: Static checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate static site files
        run: node scripts/validate-static.js

      - name: Mobile commercial UI smoke
        run: node scripts/smoke-mobile-commercial-ui.js

      - name: Check deploy config parity
        run: node scripts/check-deploy-config-parity.js

      - name: Install backend dependencies
        working-directory: WETHUS2/backend
        run: npm ci

      - name: Backend syntax check
        run: node --check WETHUS2/backend/server.js

      - name: Backend security smoke
        run: node scripts/smoke-backend-security.js

      - name: Founder moderation smoke
        run: node scripts/smoke-founder-moderation.js

      - name: Admin review queue smoke
        run: node scripts/smoke-admin-review-queue.js

      - name: Project interactions smoke
        run: node scripts/smoke-project-interactions.js

      - name: Project mentor smoke
        run: node scripts/smoke-project-mentor.js

      - name: Agent memory smoke
        run: node scripts/smoke-agent-memory.js

      - name: Integration activity log smoke
        run: node scripts/smoke-integration-activity-log.js

      - name: Google relay template smoke
        run: node scripts/smoke-google-relay-template.js

      - name: Discovery visibility smoke
        run: node scripts/smoke-discovery-visibility.js

      - name: Project application smoke
        run: node scripts/smoke-project-applications.js

      - name: Google OAuth login smoke
        run: node scripts/smoke-google-oauth-login.js

      - name: Launch readiness artifact smoke
        run: node scripts/smoke-launch-readiness-artifacts.js

      - name: Provider launch-scope smoke
        run: node scripts/smoke-provider-launch-scope.js

      - name: Provider launch-scope env override smoke
        run: node scripts/smoke-provider-launch-scope-env-override.js

      - name: Provider launch-scope enforcement smoke
        run: node scripts/smoke-provider-launch-scope-enforcement.js
